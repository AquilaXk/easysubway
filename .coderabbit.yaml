# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Write concise, specific English review comments focusing on problem, impact, and actionable suggestions without exaggeration or humor. Avoid second-person pronouns ('you') and frame feedback collaboratively."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: true
  in_progress_fortune: false
  path_instructions:
    - path: "backend/**"
      instructions: "Check authentication, security, transaction management, input validation, data consistency, and violations of eGovFrame architectural boundaries."
    - path: "apps/mobile/lib/**"
      instructions: "Check mobile UX state transitions, accessibility compliance, disabled control behavior, and Android/iOS platform-specific branch issues."
    - path: ".github/workflows/**"
      instructions: "Check secret exposure, permission scoping, conditional branch logic, fail-closed behavior, and missing deployment gates."
    - path: "contracts/**"
      instructions: "Verify API and data contract schema compatibility, missing required fields, and breaking changes to version compatibility."
    - path: "tools/datapack/**"
      instructions: "Verify accessibility data integrity for transport-vulnerable passengers, compliance with official KRIC data specifications, and strict prohibition of arbitrary fallback or heuristic estimates."
  auto_review:
    enabled: true
    drafts: false

chat:
  art: false
  auto_reply: true
