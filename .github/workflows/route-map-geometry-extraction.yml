name: Route Map Geometry Extraction

on:
  push:
    branches:
      - feat/2571-canonical-svg-runtime
    paths:
      - .github/workflows/route-map-geometry-extraction.yml

permissions:
  contents: read

jobs:
  extract-gwangju:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: chrome
        uses: browser-actions/setup-chrome@086160e580d6e8c142ad5ba29009dcde677c6321
        with:
          install-dependencies: true
      - name: Extract Gwangju geometry
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          ROUTE_MAP_CHROME_NO_SANDBOX: "1"
        run: >-
          node tools/route-map/extract-svg-geometry.mjs
          tools/route-map/route-map-defs/svg-sources/easy-subway-gwangju-v3.svg
          --region 광주권
          --pretty
          --output easy-subway-gwangju-v3-geometry.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gwangju-geometry
          path: easy-subway-gwangju-v3-geometry.json
          if-no-files-found: error
          retention-days: 1
