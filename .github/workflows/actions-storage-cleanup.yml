name: Actions Storage Cleanup

on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup-pr-caches:
    name: Delete closed PR caches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches for closed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          gh cache delete --all --ref "$BRANCH" --succeed-on-no-caches

  cleanup-weekly-caches:
    name: Delete weekly repository caches
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete all GitHub Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh cache delete --all --succeed-on-no-caches

  cleanup-ghcr-backend-images:
    name: Prune old GHCR backend images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Keep the latest 10 backend image versions
        env:
          # github.token can prune package versions only if it owns them; a
          # classic PAT with delete:packages is the fallback for user-owned GHCR.
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_PAT != '' && secrets.GHCR_CLEANUP_PAT || github.token }}
          OWNER: aquilaxk
          PACKAGE: easysubway-backend
        run: |
          set -euo pipefail

          # Keep the 10 newest versions for rollback headroom (issue #1686); the
          # digest of the previous deploy is what rollback pulls, so retention
          # must comfortably exceed the depth we might roll back to.
          # per_page=100 (single page, no --paginate): the backend image keeps
          # only ~10 tagged versions, so one page covers retention; --paginate
          # would run --jq per page and break the cross-page created_at sort.
          versions_err="$(mktemp)"
          versions="$(gh api \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[].id' 2>"${versions_err}" || true)"
          if [ -s "${versions_err}" ]; then
            # Surface a real error (auth/rate-limit/wrong path) instead of a
            # silently green no-op that pruned nothing.
            echo "::warning title=GHCR cleanup::versions 조회 오류: $(tr '\n' ' ' <"${versions_err}")"
          fi
          rm -f "${versions_err}"
          if [ -z "${versions}" ]; then
            echo "::notice title=GHCR cleanup::no ${PACKAGE} versions to prune (or token lacks packages scope)."
            exit 0
          fi

          index=0
          while read -r version_id; do
            [ -n "${version_id}" ] || continue
            index=$((index + 1))
            if [ "${index}" -le 10 ]; then
              continue
            fi
            echo "deleting ${PACKAGE} version ${version_id}"
            gh api -X DELETE \
              "/users/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}" || true
          done <<< "${versions}"

  cleanup-deploy-tags:
    name: Prune old deploy tags
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete deploy/backend tags older than 90 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # deploy/backend/<UTC yyyyMMdd-HHmm>-<sha> tags accumulate one per
          # deploy (issue #1687). Always keep the 20 most recent; among the rest,
          # delete any dated more than 90 days ago. Names sort chronologically.
          mapfile -t tags < <(gh api --paginate \
            "repos/${REPO}/git/matching-refs/tags/deploy/backend/" \
            --jq '.[].ref' 2>/dev/null | sed 's#refs/tags/##' | sort || true)

          count=${#tags[@]}
          if [ "${count}" -le 20 ]; then
            echo "only ${count} deploy tags; nothing to prune."
            exit 0
          fi

          cutoff="$(date -u -d '90 days ago' +%Y%m%d)"
          prune_upto=$((count - 20))
          for ((i = 0; i < prune_upto; i++)); do
            tag="${tags[i]}"
            datepart="${tag#deploy/backend/}"
            datepart="${datepart%%-*}"
            if [[ "${datepart}" =~ ^[0-9]{8}$ && "${datepart}" < "${cutoff}" ]]; then
              echo "deleting ${tag}"
              gh api -X DELETE "repos/${REPO}/git/refs/tags/${tag}" || true
            fi
          done
